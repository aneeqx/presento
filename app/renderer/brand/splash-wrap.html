<!doctype html><html><head><meta charset="utf-8"><title>Presento</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;cursor:default}
/* the designed splash is played unchanged inside a frame that is scaled down: it scales itself to ~72 % of the frame width */
.card{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:#0E0B0A;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
iframe{position:absolute;left:50%;top:50%;width:72%;height:72%;transform:translate(-50%,-50%);border:0;background:#0E0B0A}
</style></head><body><div class="card"><iframe src="splash.html" scrolling="no"></iframe></div>
<script>
function skip(){ try { window.splashApi.skip(); } catch (e) {} }
addEventListener("pointerdown", skip); addEventListener("keydown", skip);
</script></body></html>
